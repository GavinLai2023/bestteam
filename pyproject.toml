[project]
name = "bestteam"
version = "0.1.0"
description = "A business-friendly multi-agent framework wrapper built on LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev          = ["pytest>=8.0", "pytest-xdist>=3.5"]
test         = ["pytest-playwright>=0.5"]
ui           = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "python-multipart>=0.0.9", "cryptography>=42.0"]
tools-search = ["tavily-python>=0.3"]
tools-files  = ["pypdf>=4.0", "openpyxl>=3.1", "python-docx>=1.0"]
tools-rag    = ["rank-bm25>=0.2.2"]
tools-rag-vector = ["numpy>=1.24"]
tools-rerank = ["sentence-transformers>=2.2"]
tools-http   = ["httpx>=0.27"]
tools-email  = ["httpx>=0.27"]  # Graph backend only; the IMAP backend is stdlib
tools-places = ["httpx>=0.27"]
tools        = ["tavily-python>=0.3", "pypdf>=4.0", "openpyxl>=3.1", "python-docx>=1.0", "rank-bm25>=0.2.2", "numpy>=1.24", "httpx>=0.27"]
# Providers required to run the documented `openai:`-spec real-model paths
# (langchain string model resolution) and interview transcription (openai),
# so the official image can execute the advertised commercial paths (CR-007).
providers-openai = ["langchain>=0.3", "langchain-openai>=0.2", "openai>=1.0"]
interview    = ["openai>=1.0"]

[project.scripts]
bestteam = "bestteam.cli:app"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: pure SDK/core logic, no DB or HTTP",
    "integration: FastAPI TestClient + SQLite",
    "e2e: Playwright browser scenario",
    "slow: real Alembic migrations, concurrency timing, or full E2E journeys",
    "optional: requires an optional extra (e.g. interview/providers-openai)",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
