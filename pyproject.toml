[project]
name = "bestteam"
version = "0.1.0"
description = "A business-friendly multi-agent framework wrapper built on LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev          = ["pytest>=8.0"]
ui           = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0"]
tools-search = ["tavily-python>=0.3"]
tools-files  = ["pypdf>=4.0", "openpyxl>=3.1", "python-docx>=1.0"]
tools-rag    = ["rank-bm25>=0.2.2"]
tools-rag-vector = ["numpy>=1.24"]
tools        = ["tavily-python>=0.3", "pypdf>=4.0", "openpyxl>=3.1", "python-docx>=1.0", "rank-bm25>=0.2.2", "numpy>=1.24"]

[project.scripts]
bestteam = "bestteam.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
