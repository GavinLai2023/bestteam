server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This server only ships the static bundle; API and WebSocket traffic goes
    # from the browser straight to the backend (VITE_API_BASE / VITE_WS_BASE),
    # so upload size limits belong on whatever fronts port 8000, not here.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        # Vite content-hashes everything under /assets, so it can be immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
