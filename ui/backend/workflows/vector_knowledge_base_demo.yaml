# Single-agent support workflow backed by a vector knowledge base.
# "support_agent" can call the "company_docs" tool (cosine-similarity search
# over embeddings of kb_docs/) to ground its answers in the company's policy
# documents using semantic (not just keyword) matching.
# Uses "fake:" specs for both the model and the embeddings so the dashboard
# demo runs with zero cost / no API key. cache_path shows the recommended
# production pattern of persisting embeddings across runs.

name: vector_knowledge_base_demo

knowledge_bases:
  - name: company_docs
    type: vector
    path: ./kb_docs
    embedding_model: "fake:8"
    cache_path: ./.bestteam_cache/vector_demo.json

agents:
  - name: support_agent
    role: Customer Support Specialist
    goal: Answer customer questions using the company's policy documents
    backstory: Always checks the knowledge base before answering
    model: "fake:Based on our policy documents, here is the answer to your question."
    tools: [company_docs]

teams:
  - name: support_team
    agents: [support_agent]
    mode: sequential

workflow:
  steps: [support_team]
